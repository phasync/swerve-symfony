name: 🧪 CI

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        # The LTS versions: 6.4 and 7.4
        framework: ["6.4", "7.4"]

    name: ⚙️ Symfony ${{ matrix.framework }} on PHP ${{ matrix.php }}

    # The adapter must behave the same with and without the extension, so the suite runs both ways

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🧰 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, posix, sockets, pdo_sqlite

      - name: 📥 Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: 🏗️ Create the Symfony ${{ matrix.framework }} test application
        run: tests/create-app.sh ${{ matrix.framework }}

      - name: 🔍 Check php-cs-fixer
        run: composer php-cs-fixer-dry-run

      - name: ✅ Tests
        run: vendor/bin/pest --stop-on-defect

      - name: 📥 Find phasync-ext (bundled in phasync)
        run: |
          cp "vendor/phasync/phasync/ext/phasync-${{ matrix.php }}-nts-x86_64-glibc.so" "$RUNNER_TEMP/phasync.so"
          php -d extension="$RUNNER_TEMP/phasync.so" -r 'extension_loaded("phasync") || exit(1); echo "phasync-ext ", phpversion("phasync"), "\n";'

      - name: ✅ Tests with phasync-ext
        run: SWERVE_PHP_ARGS="-d extension=$RUNNER_TEMP/phasync.so" vendor/bin/pest --stop-on-defect
